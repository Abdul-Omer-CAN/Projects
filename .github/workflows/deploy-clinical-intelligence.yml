name: Build, Push, and Deploy Clinical Intelligence Platform

on:
    push:
        branches: [master]
        paths:
            - '04-Clinical-Intelligence-Platform/**'
    workflow_dispatch:

jobs:
    build-push-deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Configure AWS Credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                aws-region: us-east-2

            - name: Log in to Amazon ECR
              id: login-ecr
              uses: aws-actions/amazon-ecr-login@v2

            - name: Build Docker image
              working-directory: 04-Clinical-Intelligence-Platform
              run: docker build -t clinical-intelligence-api .

            - name: Tag image for ECR
              run: docker tag clinical-intelligence-api:latest 456966189523.dkr.ecr.us-east-2.amazonaws.com/clinical-intelligence-api:latest

            - name: Push image to ECR
              run: docker push 456966189523.dkr.ecr.us-east-2.amazonaws.com/clinical-intelligence-api:latest

            - name: Force new ECS deployment
              run: |
               aws ecs update-service \
                 --cluster default \
                 --service clinical-intelligence-api-service-v9ku0yie \
                 --force-new-deployment \
                 --region us-east-2